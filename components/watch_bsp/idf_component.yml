## Local copy of waveshare/esp32_s3_touch_amoled_1_75c 3.0.0 (Apache-2.0, see LICENSE) with one change:
## the QSPI panel IO uses psram_dma_direct, so pixel data is DMA'd straight from the PSRAM draw
## buffers instead of through a ~46 KB internal-RAM bounce buffer allocated per transfer.
## Versions pinned to what CI resolved for the upstream BSP.
version: 3.0.0-pw1
targets:
- esp32s3
dependencies:
  idf: ">=5.5"
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  espressif/esp_lcd_co5300: "2.2.0"
  waveshare/esp_lcd_touch_cst9217: "2.0.0"
  espressif/esp_lvgl_adapter:
    version: "0.6.4"
    public: true
  espressif/esp_codec_dev:
    version: "~1.5"
    public: true
  espressif/esp_lcd_panel_io_additions: "^1"
