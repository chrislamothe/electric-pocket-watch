name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (stage 1 and stage 2)
        shell: bash
        run: |
          set -e
          git config --global --add safe.directory "*"
          . "$IDF_PATH/export.sh"
          for STAGE in 1 2; do
            B=build-stage$STAGE
            DEFAULTS="sdkconfig.defaults"
            [ "$STAGE" = 2 ] && DEFAULTS="sdkconfig.defaults;sdkconfig.stage2"
            idf.py -B $B -D SDKCONFIG=$B/sdkconfig -D SDKCONFIG_DEFAULTS="$DEFAULTS" set-target esp32s3
            idf.py -B $B -D SDKCONFIG=$B/sdkconfig -D SDKCONFIG_DEFAULTS="$DEFAULTS" build
            echo "== stage $STAGE: key config values (a missing line means the option was ignored) =="
            grep -E "^CONFIG_(WATCH_STAGE|LV_USE_CLIB_MALLOC|LV_OS_FREERTOS|LV_USE_LOG|LV_LOG_PRINTF|RTC_CLK_SRC_INT_8MD256|LV_FONT_MONTSERRAT_16|LV_FONT_MONTSERRAT_28|LV_FONT_MONTSERRAT_36|LV_FONT_MONTSERRAT_48|SPIRAM_MODE_OCT|ESP_CONSOLE_USB_SERIAL_JTAG|PARTITION_TABLE_CUSTOM|LV_THEME_DEFAULT_DARK|LV_USE_KEYBOARD)=" $B/sdkconfig || true
            idf.py -B $B -D SDKCONFIG=$B/sdkconfig size
            idf.py -B $B -D SDKCONFIG=$B/sdkconfig merge-bin -o merged-stage$STAGE.bin
            F=$(find . -name merged-stage$STAGE.bin | head -1)
            echo "merged binary: $F"
            cp -f "$F" firmware-stage$STAGE.bin
          done
          ls -l firmware-stage*.bin
          echo "== resolved component versions =="
          grep -E "^  [a-z].*:$|^    version:" dependencies.lock | paste - - | head -40

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware-stage1.bin
            firmware-stage2.bin
            dependencies.lock
          if-no-files-found: error

  pages:
    # Publishes the browser installer (ESP Web Tools) with the stage 2 firmware.
    # One-time setup: repository Settings > Pages > Source: GitHub Actions.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: Assemble site
        shell: bash
        run: |
          set -e
          VER=$(sed -n 's/.*WATCH_VERSION *"\(.*\)".*/\1/p' main/version.h)
          mkdir -p _site
          cp site/index.html site/manifest.json _site/
          cp fw/firmware-stage2.bin _site/firmware.bin
          sed -i "s/__VERSION__/$VER/g" _site/index.html _site/manifest.json
          ls -l _site
          cat _site/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
