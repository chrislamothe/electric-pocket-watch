name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        # boards/<id>: 175c = ESP32-S3-Touch-AMOLED-1.75C, 175 = -1.75 / -1.75-B, 206 = -2.06
        board: [175c, 175, 206]
    steps:
      - uses: actions/checkout@v7

      - name: Build firmware (${{ matrix.board }})
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -e
          git config --global --add safe.directory "*"
          . "$IDF_PATH/export.sh"
          B=build-$BOARD
          idf.py -B $B -D BOARD=$BOARD -D SDKCONFIG=$B/sdkconfig set-target esp32s3
          idf.py -B $B -D BOARD=$BOARD -D SDKCONFIG=$B/sdkconfig build
          echo "== key config values (a missing line means the option was ignored) =="
          grep -E "^CONFIG_(LV_USE_CLIB_MALLOC|LV_OS_FREERTOS|LV_USE_LOG|LV_LOG_PRINTF|RTC_CLK_SRC_INT_8MD256|LV_FONT_MONTSERRAT_16|LV_FONT_MONTSERRAT_20|LV_USE_CANVAS|LV_FONT_MONTSERRAT_28|LV_FONT_MONTSERRAT_36|LV_FONT_MONTSERRAT_48|SPIRAM_MODE_OCT|ESP_CONSOLE_USB_SERIAL_JTAG|PARTITION_TABLE_CUSTOM|LV_THEME_DEFAULT_DARK|LV_USE_KEYBOARD|LV_DRAW_SW_DRAW_UNIT_CNT|ESP_TASK_WDT_PANIC|ESP_TASK_WDT_TIMEOUT_S|SPIRAM_TRY_ALLOCATE_WIFI_LWIP|SPIRAM_MALLOC_RESERVE_INTERNAL)=" $B/sdkconfig || true
          idf.py -B $B -D SDKCONFIG=$B/sdkconfig size
          idf.py -B $B -D SDKCONFIG=$B/sdkconfig merge-bin -o merged-$BOARD.bin
          F=$(find . -name merged-$BOARD.bin | head -1)
          echo "merged binary: $F"
          cp -f "$F" firmware-$BOARD.bin
          ls -l firmware-$BOARD.bin
          echo "== resolved component versions =="
          grep -E "^  [a-z].*:$|^    version:" dependencies.$BOARD.lock | paste - - | head -40

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware-${{ matrix.board }}.bin
            dependencies.${{ matrix.board }}.lock
          if-no-files-found: error

  stable:
    # The last firmware confirmed on real hardware (site/stable.txt: "<git ref> <version> <board>").
    # Rebuilt from that exact commit so the install page always offers a known-good build.
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build stable firmware
        shell: bash
        run: |
          set -e
          git config --global --add safe.directory "*"
          read REF VER BOARD < site/stable.txt
          echo "stable: $REF v$VER board $BOARD"
          git worktree add ../stable "origin/$REF" 2>/dev/null || git worktree add ../stable "$REF"
          cd ../stable
          . "$IDF_PATH/export.sh"
          if [ -f sdkconfig.stage2 ]; then
            D="sdkconfig.defaults;sdkconfig.stage2"       # layout before v0.10.0
            idf.py -B b -D SDKCONFIG=b/sdkconfig -D SDKCONFIG_DEFAULTS="$D" set-target esp32s3
            idf.py -B b -D SDKCONFIG=b/sdkconfig -D SDKCONFIG_DEFAULTS="$D" build
          else
            idf.py -B b -D BOARD=$BOARD -D SDKCONFIG=b/sdkconfig set-target esp32s3
            idf.py -B b -D BOARD=$BOARD -D SDKCONFIG=b/sdkconfig build
          fi
          idf.py -B b -D SDKCONFIG=b/sdkconfig merge-bin -o merged-stable.bin
          cp -f "$(find . -name merged-stable.bin | head -1)" "$GITHUB_WORKSPACE/firmware-stable.bin"
          ls -l "$GITHUB_WORKSPACE/firmware-stable.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-stable
          path: firmware-stable.bin
          if-no-files-found: error

  lab:
    # Clock lab firmware (main/clocklab.c): timekeeping experiments, two slow-clock variants.
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        board: [175c, 175, 206]
        variant: [fast, slow]
    steps:
      - uses: actions/checkout@v7
      - name: Build clock lab (${{ matrix.board }}, ${{ matrix.variant }})
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -e
          git config --global --add safe.directory "*"
          . "$IDF_PATH/export.sh"
          D="sdkconfig.defaults;sdkconfig.lab"
          if [ "$VARIANT" = slow ]; then D="$D;sdkconfig.lab_rcslow"; fi
          B=build-lab-$BOARD-$VARIANT
          idf.py -B $B -D BOARD=$BOARD -D SDKCONFIG=$B/sdkconfig -D SDKCONFIG_DEFAULTS="$D" set-target esp32s3
          idf.py -B $B -D BOARD=$BOARD -D SDKCONFIG=$B/sdkconfig -D SDKCONFIG_DEFAULTS="$D" build
          grep -E "^CONFIG_(WATCH_CLOCK_LAB|RTC_CLK_SRC_INT_8MD256|RTC_CLK_SRC_INT_RC)=" $B/sdkconfig
          idf.py -B $B -D SDKCONFIG=$B/sdkconfig merge-bin -o merged-lab.bin
          cp -f "$(find . -name merged-lab.bin | head -1)" firmware-lab-$BOARD-$VARIANT.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-lab-${{ matrix.board }}-${{ matrix.variant }}
          path: firmware-lab-${{ matrix.board }}-${{ matrix.variant }}.bin
          if-no-files-found: error

  pages:
    # Publishes the browser installer (ESP Web Tools): one install button and manifest per board.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, stable, lab]
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # deploy-pages only sees the first 10 artifacts of a run: fold the firmware into one first.
      - uses: actions/upload-artifact/merge@v4
        with:
          name: firmware-all
          pattern: firmware-*
          delete-merged: true
      - uses: actions/download-artifact@v8
        with:
          name: firmware-all
          path: fw
      - name: Assemble site
        shell: bash
        run: |
          set -e
          VER=$(sed -n 's/.*WATCH_VERSION *"\(.*\)".*/\1/p' main/version.h)
          SHA=${GITHUB_SHA::7}
          mkdir -p _site
          cp site/index.html _site/
          # The manifest version carries the build id, so it never equals the version the watch
          # reports and the installer always offers to install (same-version reinstall included).
          # The firmware URL carries it too, so a cached older binary is never flashed.
          for B in 175c 175 206; do
            cp fw/firmware-$B.bin _site/firmware-$B.bin
            sed -e "s/__VERSION__/$VER (build $SHA)/g" -e "s/__FIRMWARE__/firmware-$B.bin?v=$SHA/g" site/manifest.json > _site/manifest-$B.json
          done
          for B in 175c 175 206; do
            for V in fast slow; do
              cp fw/firmware-lab-$B-$V.bin _site/
              sed -e "s/__VERSION__/clock lab $VER $V (build $SHA)/g" -e "s/__FIRMWARE__/firmware-lab-$B-$V.bin?v=$SHA/g" site/manifest.json > _site/manifest-lab-$B-$V.json
            done
          done
          # Stable = last build confirmed on hardware. Older links (manifest.json / firmware.bin) get it too.
          read SREF SVER SBOARD < site/stable.txt
          cp fw/firmware-stable.bin _site/firmware-stable.bin
          sed -e "s/__VERSION__/$SVER (stable, build $SHA)/g" -e "s/__FIRMWARE__/firmware-stable.bin?v=$SHA/g" site/manifest.json > _site/manifest-stable.json
          cp _site/manifest-stable.json _site/manifest.json
          sed -i -e "s/__VERSION__/$VER/g" -e "s/__STABLE__/$SVER/g" _site/index.html
          ls -l _site
          cat _site/manifest-206.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages intermittently fails to find the just-uploaded artifact
      # ("Fetching artifact metadata failed"); wait and try again before giving up.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
