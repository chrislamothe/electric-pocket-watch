name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        # boards/<id>: 175c = ESP32-S3-Touch-AMOLED-1.75C, 175 = -1.75 / -1.75-B, 206 = -2.06
        board: [175c, 175, 206]
    steps:
      - uses: actions/checkout@v7

      - name: Build firmware (${{ matrix.board }})
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -e
          git config --global --add safe.directory "*"
          . "$IDF_PATH/export.sh"
          B=build-$BOARD
          idf.py -B $B -D BOARD=$BOARD -D SDKCONFIG=$B/sdkconfig set-target esp32s3
          idf.py -B $B -D BOARD=$BOARD -D SDKCONFIG=$B/sdkconfig build
          echo "== key config values (a missing line means the option was ignored) =="
          grep -E "^CONFIG_(LV_USE_CLIB_MALLOC|LV_OS_FREERTOS|LV_USE_LOG|LV_LOG_PRINTF|RTC_CLK_SRC_INT_8MD256|LV_FONT_MONTSERRAT_16|LV_FONT_MONTSERRAT_20|LV_USE_CANVAS|LV_FONT_MONTSERRAT_28|LV_FONT_MONTSERRAT_36|LV_FONT_MONTSERRAT_48|SPIRAM_MODE_OCT|ESP_CONSOLE_USB_SERIAL_JTAG|PARTITION_TABLE_CUSTOM|LV_THEME_DEFAULT_DARK|LV_USE_KEYBOARD|LV_DRAW_SW_DRAW_UNIT_CNT|ESP_TASK_WDT_PANIC|ESP_TASK_WDT_TIMEOUT_S|SPIRAM_TRY_ALLOCATE_WIFI_LWIP|SPIRAM_MALLOC_RESERVE_INTERNAL)=" $B/sdkconfig || true
          idf.py -B $B -D SDKCONFIG=$B/sdkconfig size
          idf.py -B $B -D SDKCONFIG=$B/sdkconfig merge-bin -o merged-$BOARD.bin
          F=$(find . -name merged-$BOARD.bin | head -1)
          echo "merged binary: $F"
          cp -f "$F" firmware-$BOARD.bin
          ls -l firmware-$BOARD.bin
          echo "== resolved component versions =="
          grep -E "^  [a-z].*:$|^    version:" dependencies.$BOARD.lock | paste - - | head -40

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware-${{ matrix.board }}.bin
            dependencies.${{ matrix.board }}.lock
          if-no-files-found: error

  stable:
    # The last firmware confirmed on real hardware (site/stable.txt: "<git ref> <version> <board>").
    # Rebuilt from that exact commit so the install page always offers a known-good build.
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build stable firmware
        shell: bash
        run: |
          set -e
          git config --global --add safe.directory "*"
          read REF VER BOARD < site/stable.txt
          echo "stable: $REF v$VER board $BOARD"
          git worktree add ../stable "$REF"
          cd ../stable
          . "$IDF_PATH/export.sh"
          if [ -f sdkconfig.stage2 ]; then
            D="sdkconfig.defaults;sdkconfig.stage2"       # layout before v0.10.0
            idf.py -B b -D SDKCONFIG=b/sdkconfig -D SDKCONFIG_DEFAULTS="$D" set-target esp32s3
            idf.py -B b -D SDKCONFIG=b/sdkconfig -D SDKCONFIG_DEFAULTS="$D" build
          else
            idf.py -B b -D BOARD=$BOARD -D SDKCONFIG=b/sdkconfig set-target esp32s3
            idf.py -B b -D BOARD=$BOARD -D SDKCONFIG=b/sdkconfig build
          fi
          idf.py -B b -D SDKCONFIG=b/sdkconfig merge-bin -o merged-stable.bin
          cp -f "$(find . -name merged-stable.bin | head -1)" "$GITHUB_WORKSPACE/firmware-stable.bin"
          ls -l "$GITHUB_WORKSPACE/firmware-stable.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-stable
          path: firmware-stable.bin
          if-no-files-found: error

  pages:
    # Publishes the browser installer (ESP Web Tools): one install button and manifest per board.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, stable]
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: fw
      - name: Assemble site
        shell: bash
        run: |
          set -e
          VER=$(sed -n 's/.*WATCH_VERSION *"\(.*\)".*/\1/p' main/version.h)
          mkdir -p _site
          cp site/index.html _site/
          for B in 175c 175 206; do
            cp fw/firmware-$B.bin _site/firmware-$B.bin
            sed -e "s/__VERSION__/$VER/g" -e "s/__FIRMWARE__/firmware-$B.bin/g" site/manifest.json > _site/manifest-$B.json
          done
          # Stable = last build confirmed on hardware. Older links (manifest.json / firmware.bin) get it too.
          read SREF SVER SBOARD < site/stable.txt
          cp fw/firmware-stable.bin _site/firmware-stable.bin
          sed -e "s/__VERSION__/$SVER/g" -e "s/__FIRMWARE__/firmware-stable.bin/g" site/manifest.json > _site/manifest-stable.json
          cp _site/manifest-stable.json _site/manifest.json
          sed -i -e "s/__VERSION__/$VER/g" -e "s/__STABLE__/$SVER/g" _site/index.html
          ls -l _site
          cat _site/manifest-206.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
